<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна робота №3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <nav class="menu">
      <a href="#">Головна</a>
      <a href="#">Про нас</a>
      <a href="#">Послуги</a>
      <a href="#">Контакти</a>
      <a href="#">Блог</a>
    </nav>

    <h1>Лабораторна робота №3</h1>

    <section class="cards-container">
      <div class="card">
        <img src="https://picsum.photos/300/200?random=1" alt="Ноутбук" />
        <h3>Сучасний ноутбук</h3>
        <p>Ноутбук із потужним процесором та великим екраном.</p>
        <button>Купити</button>
      </div>

      <div class="card">
        <img src="https://picsum.photos/300/200?random=2" alt="Вебінар" />
        <h3>Безплатний вебінар</h3>
        <p>Дізнайся основи веброзробки та сучасних вебтехнологій.</p>
        <button>Записатися</button>
      </div>

      <div class="card">
        <img src="https://picsum.photos/300/200?random=3" alt="Футболка" />
        <h3>Крута футболка</h3>
        <p>Зручна футболка зі 100% бавовни та сучасним дизайном.</p>
        <button>Детальніше</button>
      </div>
    </section>

    <div class="buttons-container">
      <button class="action-button">Кнопка 1</button>
      <button class="action-button">Кнопка 2</button>
      <button class="action-button">Кнопка 3</button>
    </div>
  </body>
</html>
